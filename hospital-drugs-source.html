<style>

  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 1120px; margin: 28px auto; padding: 0 16px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color:var(--muted); margin-bottom: 20px; line-height:1.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow: 0 8px 24px rgba(15,23,42,.06); }
  .searchbar { display:grid; grid-template-columns: 1fr 150px 130px; gap:10px; }
  input, select, button { font-size:16px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#fff; }
  input:focus, select:focus { outline:2px solid rgba(37,99,235,.18); border-color:var(--accent); }
  button { background:var(--accent); color:white; border:0; cursor:pointer; font-weight:700; }
  button:hover { filter: brightness(.96); }
  .hint { color:var(--muted); font-size:13px; margin-top:10px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin: 16px 0; }
  .pill { background:#eef2ff; color:#3730a3; border-radius:999px; padding:6px 10px; font-size:13px; }
  .notice { margin-top:12px; padding:10px 12px; border-radius:12px; background:#fffbeb; color:#78350f; border:1px solid #fde68a; font-size:14px; }
  table { width:100%; border-collapse:separate; border-spacing:0; margin-top:16px; overflow:hidden; border-radius:14px; border:1px solid var(--line); }
  th, td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; font-size:14px; }
  th { background:#f3f4f6; font-weight:800; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  .name { font-weight:800; }
  .small { color:var(--muted); font-size:12px; line-height:1.45; }
  .score { font-weight:800; color:var(--ok); }
  .badge { display:inline-block; padding:3px 7px; border-radius:999px; background:#ecfdf5; color:#065f46; font-size:12px; margin-top:4px; }
  .badge.warn { background:#fff7ed; color:#9a3412; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  mark { background:#fef3c7; padding:0 2px; border-radius:3px; }
  @media (max-width: 760px) { .searchbar { grid-template-columns: 1fr; } table { display:block; overflow-x:auto; } }
</style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <div class="searchbar">

        <select id="route">

          <option value="외용">외용</option>
          <option value="주사">주사</option>
          <option value="수액">수액</option>
        </select>
        <button id="btn">검색</button>
      </div>
      <div class="hint">팁: 상품명이 안 잡히면 성분명 일부 또는 효능 키워드로 검색해 보세요. 예: “암로디핀”, “스타틴”, “위산”, “항생제”.</div>
      <div class="stats" id="stats"></div>

      <div id="out"></div>
    </div>
  </div>

const normalize = (s) => (s||'').toString().toLowerCase()
  .replaceAll('㎎','mg').replaceAll('㎖','ml').replaceAll('㎍','mcg')
  .replace(/[\s\-_/.,()[\]{}]/g,'')
  .replace(/정|캡슐|캅셀|시럽|액|주|크림|연고|겔|패취|패치/g,'');
const rawNorm = (s) => (s||'').toString().toLowerCase().replaceAll('㎎','mg').replaceAll('㎖','ml').replaceAll('㎍','mcg');
function scoreDrug(d, query) {
  const q = normalize(query);
  const qr = rawNorm(query).trim();
  if (!q) return {score:0, reason:''};
  const fields = {
    약품명: d.name, 성분명: d.ingredient, 효능: d.efficacy, 분류: d.category + ' ' + d.subcategory,
    유사약명: [d.similarSound, d.similarShape].filter(Boolean).join(' ')
  };
  let score = 0, reasons = [];
  for (const [label, val] of Object.entries(fields)) {
    const nv = normalize(val);
    const rv = rawNorm(val);
    if (!val) continue;
    if (nv === q) { score += label==='약품명' ? 120 : 105; reasons.push(label+' 완전일치'); }
    else if (nv.includes(q)) { score += label==='약품명' ? 95 : label==='성분명' ? 90 : 55; reasons.push(label+' 포함'); }
    else if (q.length >= 3 && nv.includes(q.slice(0, Math.max(3, Math.floor(q.length*.7))))) { score += 30; reasons.push(label+' 일부일치'); }
    if (qr && rv.includes(qr)) score += 10;
  }
  // multiple token support
  const tokens = qr.split(/\s+/).filter(t=>t.length>=2);
  for (const t of tokens) {
    const nt = normalize(t);
    if (normalize(d.name+' '+d.ingredient+' '+d.efficacy).includes(nt)) score += 12;
  }
  return {score, reason:[...new Set(reasons)].slice(0,3).join(', ')};
}
function highlight(text, query) {
  if (!text) return '';
  const q = query.trim();
  if (!q || q.length < 2) return escapeHtml(text);
  const safe = escapeRegExp(q);
  return escapeHtml(text).replace(new RegExp(safe, 'gi'), m => `<mark>${m}</mark>`);
}
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function search() {
  const q = document.getElementById('q').value.trim();
  const route = document.getElementById('route').value;
  const pool = route === 'all' ? DRUGS : DRUGS.filter(d => d.sheet === route);
  document.getElementById('stats').innerHTML = `<span class="pill">본원 약품 ${DRUGS.length}개</span><span class="pill">검색 대상 ${pool.length}개</span>`;
  if (!q) { document.getElementById('out').innerHTML = '<div class="empty">약 이름을 입력하면 추천 후보가 표시됩니다.</div>'; return; }
  let results = pool.map(d => ({...d, ...scoreDrug(d,q)})).filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score || a.name.localeCompare(b.name, 'ko')).slice(0, 20);
  if (!results.length) { document.getElementById('out').innerHTML = '<div class="empty">검색 결과가 없습니다. 상품명 대신 성분명이나 효능 키워드로 다시 검색해 보세요.</div>'; return; }
  const rows = results.map((d,idx) => `
    <tr>
      <td class="score">${idx+1}<br><span class="small">${d.score}점</span></td>
      <td><div class="name">${highlight(d.name,q)}</div><div class="small">처방코드: ${escapeHtml(d.code)} · ${escapeHtml(d.sheet)}</div>${d.doseCaution?`<span class="badge warn">용량주의</span>`:''}</td>
      <td>${d.ingredient ? highlight(d.ingredient,q) : '<span class="small">-</span>'}<div class="small">${escapeHtml(d.strength||'')}</div></td>
      <td>${highlight(d.efficacy,q)}<div class="small">${escapeHtml([d.category,d.subcategory].filter(Boolean).join(' > '))}</div></td>
      <td>${escapeHtml(d.company||'')}</td>
      <td><span class="badge">${escapeHtml(d.reason || '키워드 유사')}</span>${(d.similarSound||d.similarShape)?`<div class="small">유사: ${escapeHtml([d.similarSound,d.similarShape].filter(Boolean).join(', '))}</div>`:''}</td>
    </tr>`).join('');
  document.getElementById('out').innerHTML = `<table><thead><tr><th>추천</th><th>본원 후보약</th><th>성분/함량</th><th>효능/분류</th><th>제약회사</th><th>추천 이유</th></tr></thead><tbody>${rows}</tbody></table>`;
}
document.getElementById('btn').addEventListener('click', search);
document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') search(); });
document.getElementById('q').addEventListener('input', () => { clearTimeout(window.__t); window.__t=setTimeout(search,180); });
document.getElementById('route').addEventListener('change', search);
document.getElementById('stats').innerHTML = `<span class="pill">본원 약품 ${DRUGS.length}개</span><span class="pill">경구/외용/주사/수액 포함</span>`;
document.getElementById('out').innerHTML = '<div class="empty">약 이름을 입력하면 추천 후보가 표시됩니다.</div>';
</script>
